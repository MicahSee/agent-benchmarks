# Promotes the current :staging image to production.
# Re-tags :staging as :prod-{date}-{sha} and :prod-latest in ECR — no rebuild.
# Run manually: gh workflow run promote.yml

name: Promote to Production

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPO: agent-benchmarks

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::508141210353:role/agent-benchmarks-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Re-tag staging → production
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}"
          DATE=$(date +%Y-%m-%d)
          SHORT_SHA=$(echo "${{ github.sha }}" | head -c 7)
          PROD_TAG="prod-${DATE}-${SHORT_SHA}"

          MANIFEST=$(aws ecr batch-get-image \
            --repository-name ${{ env.ECR_REPO }} \
            --image-ids imageTag=staging \
            --query 'images[0].imageManifest' \
            --output text)

          aws ecr put-image \
            --repository-name ${{ env.ECR_REPO }} \
            --image-tag "$PROD_TAG" \
            --image-manifest "$MANIFEST"

          aws ecr put-image \
            --repository-name ${{ env.ECR_REPO }} \
            --image-tag "prod-latest" \
            --image-manifest "$MANIFEST"

          echo "Promoted :staging → :${PROD_TAG} + :prod-latest"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster agent-benchmarks \
            --service agent-benchmarks \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} > /dev/null
          echo "ECS service redeployment triggered."
