{% extends "base.html" %}
{% block title %}Sign In — Agent Benchmarks{% endblock %}
{% block content %}
<div class="min-h-screen flex flex-col">
  <!-- Header -->
  <header class="flex items-center justify-between px-8 py-4 border-b border-zinc-800">
    <img src="/static/logo.png" alt="Aslan" class="h-8">
    <span class="text-sm font-medium text-zinc-400 tracking-wide uppercase">Agent Benchmarks</span>
  </header>

  <!-- Login form -->
  <div class="flex-1 flex items-center justify-center">
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-8 w-full max-w-sm">
      <h2 class="text-xl font-semibold text-zinc-100 mb-1">Sign in</h2>
      <p class="text-sm text-zinc-500 mb-6">Enter your credentials to continue</p>
      {% if error %}
      <div class="bg-red-950 border border-red-800 text-red-400 text-sm px-4 py-3 rounded-lg mb-5">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login" class="space-y-4" onsubmit="handleSubmit(this)">
        <div>
          <label class="block text-sm font-medium text-zinc-400 mb-1">Email</label>
          <input type="email" name="email" autocomplete="email"
            class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-amber-500" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-zinc-400 mb-1">Password</label>
          <input type="password" name="password" autocomplete="current-password"
            class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-amber-500" required>
        </div>
        <button id="submit-btn" type="submit"
          class="w-full bg-amber-500 text-zinc-900 py-2 rounded-lg text-sm font-medium hover:bg-amber-400 transition-colors">
          Sign in
        </button>
      </form>
      <script>
        function handleSubmit(form) {
          const btn = document.getElementById('submit-btn');
          btn.disabled = true;
          btn.textContent = 'Signing in...';
          btn.classList.add('opacity-75', 'cursor-not-allowed');
        }
      </script>
    </div>
  </div>
</div>
{% endblock %}
