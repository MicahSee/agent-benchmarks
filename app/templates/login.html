{% extends "base.html" %}
{% block title %}Sign In — Agent Benchmarks{% endblock %}
{% block content %}
<div class="min-h-screen flex flex-col bg-zinc-950">
  <!-- Header -->
  <header class="flex items-center justify-between px-8 py-4 border-b border-zinc-800">
    <img src="/static/logo.png" alt="Aslan" class="h-8">
    <span class="text-xs font-semibold tracking-widest uppercase text-zinc-500">Agent Benchmarks</span>
  </header>

  <!-- Login form -->
  <div class="flex-1 flex items-center justify-center">
    <div class="w-full max-w-sm border border-zinc-800 bg-zinc-900 p-8">
      <h2 class="text-xl font-semibold text-zinc-100 mb-1">Sign in</h2>
      <p class="text-sm text-zinc-500 mb-8">Enter your credentials to continue</p>
      {% if error %}
      <div class="border-l-4 border-red-500 bg-red-950 text-red-400 text-sm px-4 py-3 mb-6">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login" class="space-y-6" onsubmit="handleSubmit(this)">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Email</label>
          <input type="email" name="email" autocomplete="email"
            class="w-full bg-zinc-800 border border-zinc-700 px-3 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-amber-500" required>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Password</label>
          <input type="password" name="password" autocomplete="current-password"
            class="w-full bg-zinc-800 border border-zinc-700 px-3 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-amber-500" required>
        </div>
        <button id="submit-btn" type="submit"
          class="w-full bg-amber-500 text-zinc-900 py-2.5 text-sm font-semibold hover:bg-amber-400 transition-colors">
          Sign in
        </button>
      </form>
      <script>
        function handleSubmit(form) {
          const btn = document.getElementById('submit-btn');
          btn.disabled = true;
          btn.textContent = 'Signing in...';
          btn.classList.add('opacity-75', 'cursor-not-allowed');
        }
      </script>
    </div>
  </div>
</div>
{% endblock %}
