{% extends "base.html" %}
{% block title %}Sign In — Agent Benchmarks{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 w-full max-w-sm">
    <h2 class="text-xl font-semibold text-gray-800 mb-1">Sign in</h2>
    <p class="text-sm text-gray-400 mb-6">Agent Benchmarks</p>
    {% if error %}
    <div class="bg-red-50 text-red-700 text-sm px-4 py-3 rounded-lg mb-5">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" name="email" autocomplete="email"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" autocomplete="current-password"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
      </div>
      <button type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors">
        Sign in
      </button>
    </form>
  </div>
</div>
{% endblock %}
