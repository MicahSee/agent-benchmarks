{% extends "base.html" %}
{% block title %}Sign In — Agent Benchmarks{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center">
  <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-8 w-full max-w-sm">
    <h2 class="text-xl font-semibold text-zinc-100 mb-1">Sign in</h2>
    <p class="text-sm text-zinc-500 mb-6">Agent Benchmarks</p>
    {% if error %}
    <div class="bg-red-950 border border-red-800 text-red-400 text-sm px-4 py-3 rounded-lg mb-5">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="space-y-4" onsubmit="handleSubmit(this)">
      <div>
        <label class="block text-sm font-medium text-zinc-400 mb-1">Email</label>
        <input type="email" name="email" autocomplete="email"
          class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-zinc-500" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-zinc-400 mb-1">Password</label>
        <input type="password" name="password" autocomplete="current-password"
          class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-zinc-500" required>
      </div>
      <button id="submit-btn" type="submit"
        class="w-full bg-zinc-100 text-zinc-900 py-2 rounded-lg text-sm font-medium hover:bg-white transition-colors">
        Sign in
      </button>
    </form>
    <script>
      function handleSubmit(form) {
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.textContent = 'Signing in...';
        btn.classList.add('opacity-75', 'cursor-not-allowed');
      }
    </script>
  </div>
</div>
{% endblock %}
