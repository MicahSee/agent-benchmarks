[project]
name = "agent-benchmarks"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "boto3>=1.35",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends.legacy:open"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
